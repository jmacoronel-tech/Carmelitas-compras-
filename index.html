<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carmelitas Compras</title>
<meta name="description" content="Registro único de facturas, vencimientos y pagos a proveedores para Carmelitas Pan SAC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f3f4f7;
    --surface:#ffffff;
    --surface-2:#eaecf2;
    --border:#dcdfe7;
    --text:#1a2130;
    --text-2:#5b6472;
    --text-3:#96a0ac;
    --accent:#2c4a7c;
    --accent-ink:#ffffff;
    --accent-soft:#e2e9f5;
    --good:#2f7d54;
    --good-soft:#e0f0e6;
    --warn:#a97317;
    --warn-soft:#f5e8cd;
    --crit:#b3392b;
    --crit-soft:#f7ddd8;
    --shadow: 0 1px 2px rgba(20,26,38,.05), 0 8px 24px -12px rgba(20,26,38,.16);
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141822;
      --surface:#1c2130;
      --surface-2:#242a3b;
      --border:#343c50;
      --text:#eaedf4;
      --text-2:#b0b8c8;
      --text-3:#7c869a;
      --accent:#6f97d6;
      --accent-ink:#0e1420;
      --accent-soft:#26314a;
      --good:#7fc39b;
      --good-soft:#1d3327;
      --warn:#e0b256;
      --warn-soft:#3a2f16;
      --crit:#e59486;
      --crit-soft:#3b241f;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141822;
    --surface:#1c2130;
    --surface-2:#242a3b;
    --border:#343c50;
    --text:#eaedf4;
    --text-2:#b0b8c8;
    --text-3:#7c869a;
    --accent:#6f97d6;
    --accent-ink:#0e1420;
    --accent-soft:#26314a;
    --good:#7fc39b;
    --good-soft:#1d3327;
    --warn:#e0b256;
    --warn-soft:#3a2f16;
    --crit:#e59486;
    --crit-soft:#3b241f;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-weight:800; text-wrap:balance; margin:0; }
  button{font-family:inherit;}
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; }
  ::selection{background:var(--accent-soft);}

  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:226px; flex:0 0 226px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px 14px; gap:22px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
  .brand-mark{ width:34px;height:34px;border-radius:9px; background:var(--accent); color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;flex:none; font-weight:800; font-size:15px; }
  .brand-text h1{font-size:15.5px;line-height:1.15;}
  .brand-text span{font-size:11px;color:var(--text-2);letter-spacing:.02em;}

  nav.tabs{display:flex;flex-direction:column;gap:2px;}
  .tab-btn{ display:flex;align-items:center;gap:10px; padding:9px 10px;border-radius:8px;border:none;background:transparent;
    color:var(--text-2); font-size:13.5px; font-weight:700; cursor:pointer; text-align:left; width:100%; position:relative; }
  .tab-btn svg{flex:none;width:17px;height:17px;stroke:currentColor;}
  .tab-btn:hover{background:var(--surface-2); color:var(--text);}
  .tab-btn.active{background:var(--accent-soft); color:var(--accent);}
  .tab-badge{ margin-left:auto; font-size:10.5px; font-weight:800; background:var(--crit); color:#fff;
    border-radius:99px; min-width:17px; height:17px; padding:0 5px; display:flex;align-items:center;justify-content:center;
    font-variant-numeric:tabular-nums; }

  .sidebar-foot{margin-top:auto; padding:10px 6px; font-size:11px; color:var(--text-3); border-top:1px solid var(--border); padding-top:12px;}

  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px; border-bottom:1px solid var(--border);
    background:var(--surface); gap:16px; flex-wrap:wrap; }
  .topbar h2{font-size:20px;}
  .topbar .sub{color:var(--text-2); font-size:12.5px; margin-top:2px;}
  .content{padding:24px 28px 60px; max-width:1220px; width:100%;}

  .btn{ display:inline-flex;align-items:center;gap:6px; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); padding:8px 13px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn:hover{background:var(--surface-2);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-sm{padding:5px 9px; font-size:12px;}
  .btn:focus-visible, .tab-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent); outline-offset:1px; }

  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .kpi .n{font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
  .kpi .l{color:var(--text-2); font-size:11.5px; margin-top:8px; font-weight:700;}
  .kpi.crit .n{color:var(--crit);} .kpi.warn .n{color:var(--warn);} .kpi.good .n{color:var(--good);}

  .grid-2{display:grid; grid-template-columns:1.2fr 1fr; gap:18px;}
  @media (max-width:960px){ .grid-2{grid-template-columns:1fr;} .app{flex-direction:column;} .sidebar{width:100%; flex:none; flex-direction:row; overflow-x:auto; align-items:center;} nav.tabs{flex-direction:row;} .sidebar-foot{display:none;} .brand{display:none;} }

  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .panel-head{padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .panel-head h3{font-size:14.5px;}
  .panel-body{padding:4px 0;}
  .group-head{ padding:8px 16px; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:12.5px;
    display:flex; justify-content:space-between; text-transform:uppercase; letter-spacing:.02em; }
  .group-total{font-family:"IBM Plex Mono",monospace;}

  .list-row{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:700; font-size:13.5px;}
  .list-row .meta{color:var(--text-2); font-size:12px;}
  .list-row .right{margin-left:auto; text-align:right; font-variant-numeric:tabular-nums;}
  .empty-note{padding:22px 16px; color:var(--text-2); font-size:13px; text-align:center;}

  .bar-row{display:grid; grid-template-columns:120px 1fr 90px; align-items:center; gap:10px; padding:9px 16px;}
  .bar-track{height:9px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:99px;}
  .bar-amt{font-family:"IBM Plex Mono",monospace; font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums;}

  .filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .filters input[type=text], .filters input[type=date], .filters select{ border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13px; }
  .filters input[type=text]{min-width:200px; flex:1;}
  .filters .sep{color:var(--text-3); font-size:12px;}
  .btn-group{display:flex; gap:6px; flex-wrap:wrap;}

  .photo-drop{ border:1px dashed var(--border); border-radius:8px; padding:10px; background:var(--surface-2); font-size:12px; color:var(--text-2); }
  .photo-drop input[type=file]{ font-size:12px; width:100%; }
  .photo-preview{ margin-top:8px; max-width:100%; max-height:140px; border-radius:6px; border:1px solid var(--border); display:block; }
  .foto-modal-img{ max-width:100%; border-radius:8px; display:block; }

  @media screen{ .print-only{display:none;} }
  @media print{
    @page{ size: A4 portrait; margin: 14mm; }
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    #print-area{position:absolute; left:0; top:0; width:100%; padding:0; color:#111; background:#fff;}
  }

  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px; min-width:680px;}
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2);
    padding:9px 14px; border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; }
  tbody td{padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; font-family:"IBM Plex Mono",monospace;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{ border:1px solid var(--border); background:var(--surface); border-radius:6px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-2); flex:none; }
  .icon-btn:hover{color:var(--text); background:var(--surface-2);}
  .icon-btn svg{width:13px;height:13px;stroke:currentColor;}

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    font-size:11.5px; font-weight:700; white-space:nowrap; }
  .chip::before{content:""; width:6px; height:6px; border-radius:99px; background:currentColor;}
  .chip.good{background:var(--good-soft); color:var(--good);}
  .chip.warn{background:var(--warn-soft); color:var(--warn);}
  .chip.crit{background:var(--crit-soft); color:var(--crit);}
  .chip.neutral{background:var(--surface-2); color:var(--text-2);}
  .chip-line{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--text-2);margin:2px 4px 2px 0;}

  .modal-back{ position:fixed; inset:0; background:rgba(15,18,26,.5); display:none; align-items:flex-start; justify-content:center;
    padding:6vh 16px; z-index:50; overflow-y:auto; }
  .modal-back.open{display:flex;}
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:12px; width:100%; max-width:460px;
    box-shadow:var(--shadow); padding:20px; }
  .modal.wide{max-width:660px;}
  .modal h3{font-size:16.5px; margin-bottom:14px;}
  .field{margin-bottom:12px; display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:700; color:var(--text-2);}
  .field input, .field select, .field textarea{ border:1px solid var(--border); background:var(--bg); color:var(--text);
    border-radius:7px; padding:8px 10px; font-size:13.5px; font-family:inherit; }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field-row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .modal-actions{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:16px;}
  .total-line{font-size:13px; font-weight:700; color:var(--text-2);}
  .total-line b{font-family:"IBM Plex Mono",monospace; color:var(--text); font-size:15px;}

  .items-head{font-size:12px; font-weight:700; color:var(--text-2); margin:16px 0 8px; display:flex; align-items:center; justify-content:space-between;}
  .item-row{display:grid; grid-template-columns:1fr 1fr 1.3fr .8fr auto; gap:8px; align-items:end; margin-bottom:8px;}
  .item-row label{font-size:10.5px; font-weight:700; color:var(--text-3); display:block; margin-bottom:3px;}
  .item-row select, .item-row input{width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:7px; padding:7px 8px; font-size:12.5px; font-family:inherit;}
  .item-remove{border:1px solid var(--border); background:var(--surface); border-radius:6px; width:30px; height:30px; color:var(--text-2); cursor:pointer;}
  .item-remove:hover{color:var(--crit); background:var(--crit-soft); border-color:var(--crit);}
  @media (max-width:560px){ .item-row{grid-template-columns:1fr;} .item-remove{justify-self:end;} }

  .conditional-box{border:1px dashed var(--border); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--surface-2);}

  .prose{max-width:70ch; font-size:14px;}
  .prose p{margin:0 0 14px;}

  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .2s ease; z-index:80; }
  .toast.show{opacity:1;}

  .demo-banner{ background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn); border-radius:8px;
    padding:9px 13px; font-size:12.5px; font-weight:600; margin-bottom:16px; }

  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:32px; width:100%; max-width:340px; box-shadow:0 8px 28px rgba(0,0,0,.08); }
  .login-card h1{ font-size:18px; margin:0 0 4px; }
  .login-card p{ color:var(--text-2); font-size:13px; margin:0 0 20px; }
  .login-card .field{ margin-bottom:14px; }
  .login-card label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:5px; }
  .login-card input{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; background:var(--surface); color:var(--text); }
  .login-error{ color:#b3261e; font-size:12.5px; margin:-4px 0 12px; min-height:16px; }
  .login-card button{ width:100%; }
</style>
</head>
<body>

<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1>Carmelitas Compras</h1>
    <p>Ingresa con la clave del negocio para ver y registrar la información.</p>
    <form id="form-login">
      <div class="field"><label>Clave del negocio</label><input type="password" id="login-pass" autocomplete="current-password" required></div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
  </div>
</div>

<div class="app" id="app-root" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">CP</div>
      <div class="brand-text">
        <h1>Carmelitas Pan</h1>
        <span>Compras &amp; pagos</span>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-tab="resumen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Resumen</span>
      </button>
      <button class="tab-btn" data-tab="documentos">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 13h6M9 17h6M9 9h3"/></svg>
        <span>Documentos</span>
      </button>
      <button class="tab-btn" data-tab="porpagar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>Por pagar</span>
        <span class="tab-badge" id="badge-porpagar" hidden>0</span>
      </button>
      <button class="tab-btn" data-tab="pagos">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        <span>Pagos realizados</span>
      </button>
      <button class="tab-btn" data-tab="proveedores">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="14" height="11" rx="1.5"/><path d="M15 10h4l3 3.5V17h-7"/><circle cx="6" cy="19" r="1.7"/><circle cx="17.5" cy="19" r="1.7"/></svg>
        <span>Proveedores</span>
      </button>
      <button class="tab-btn" data-tab="pagosdiarios" style="border-top:1px solid var(--border); margin-top:6px; padding-top:11px;">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/><circle cx="7" cy="14.5" r="1.4"/></svg>
        <span>Pagos diarios 🔒</span>
        <span class="tab-badge" id="badge-pagosdiarios" hidden>0</span>
      </button>
    </nav>
    <div class="sidebar-foot"><span id="saludo-equipo">¡Hola, equipo!</span>
      <div style="margin-top:10px;"><button type="button" class="btn btn-sm" id="btn-logout" style="width:100%;">Cerrar sesión</button></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="topbar-title">Resumen</h2>
        <div class="sub" id="topbar-sub">—</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <span id="conexion-badge" class="chip good">● En línea</span>
        <div id="topbar-actions"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-back" id="modal-back">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<datalist id="proveedores-datalist"></datalist>
<datalist id="bancos-datalist">
  <option value="BCP"></option><option value="BBVA"></option><option value="Interbank"></option><option value="Scotiabank"></option><option value="Efectivo"></option>
</datalist>
<div id="print-area" class="print-only"></div>

  function wireLogin(){
    var form = document.getElementById("form-login");
    var errEl = document.getElementById("login-error");
    var loginScreen = document.getElementById("login-screen");
    var appRoot = document.getElementById("app-root");

    function entrar(){
      loginScreen.hidden = true; appRoot.hidden = false;
      initDb();
    }
    function salir(){
      try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
      loginScreen.hidden = false; appRoot.hidden = true;
    }

    var yaEntro = false;
    try{ yaEntro = localStorage.getItem(SESSION_KEY) === "1"; }catch(e){}
    if(yaEntro){ entrar(); }

    form.addEventListener("submit", function(e){
      e.preventDefault();
      errEl.textContent = "";
      var pass = document.getElementById("login-pass").value;
      if(pass === CLAVE_NEGOCIO){
        try{ localStorage.setItem(SESSION_KEY, "1"); }catch(e){}
        entrar();
      } else {
        errEl.textContent = "Clave incorrecta.";
      }
    });
    var logoutBtn = document.getElementById("btn-logout");
    if(logoutBtn) logoutBtn.addEventListener("click", salir);
  }

  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function addDaysISO(dateStr, n){
    var d = new Date(dateStr+"T00:00:00"); if(isNaN(d)) d = new Date();
    d.setDate(d.getDate()+Number(n||0));
    return d.toISOString().slice(0,10);
  }
  function daysUntil(dateStr){
    if(!dateStr) return null;
    var d = new Date(dateStr+"T00:00:00");
    if(isNaN(d)) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    return Math.round((d-today)/86400000);
  }
  function fmtDate(s){
    if(!s) return "—";
    var d = new Date(s+"T00:00:00");
    if(isNaN(d)) return "—";
    return d.toLocaleDateString("es-PE",{day:"2-digit",month:"short",year:"numeric"});

  /* ---------------- DB wiring ---------------- */
  function findProveedorNombre(id){
    var p = state.proveedores.find(function(x){return x.id===id;});
    return p ? p.nombre : "";
  }
  function refreshProveedoresDatalist(){
    var dl = document.getElementById("proveedores-datalist");
    dl.innerHTML = state.proveedores.map(function(p){ return '<option value="'+esc(p.nombre)+'"></option>'; }).join("");
  }

  var dbInitDone = false;
  function initDb(){
    if(dbInitDone) return;
    dbInitDone = true;
    state.db = firestoreDb; state.isDemo = false;

    firestoreDb.collection(COL_PROVEEDORES).onSnapshot(function(snap){
      state.proveedores = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      refreshProveedoresDatalist();
      render();
    }, function(err){ console.warn("proveedores onSnapshot:", err); });

    firestoreDb.collection(COL_DOCUMENTOS).onSnapshot(function(snap){
      state.documentos = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
        .sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
      render();
    }, function(err){ console.warn("documentos onSnapshot:", err); });

    firestoreDb.collection(COL_PAGOS_DIARIOS).onSnapshot(function(snap){
      state.pagosDiarios = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
        .sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
      render();
    }, function(err){ console.warn("pagosDiarios onSnapshot:", err); });

    firestoreDb.collection(COL_RENDICION).onSnapshot(function(snap){
      state.rendiciones = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
        .sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
      render();
    }, function(err){ console.warn("rendicion onSnapshot:", err); });

    render();
  }

  /* ---------------- CRUD: proveedores ---------------- */
  function saveProveedor(data, id){
    if(state.isDemo){
      if(id){ Object.assign(state.proveedores.find(function(p){return p.id===id;}), data); }
      else{ data.id=uid(); state.proveedores.push(data); }
      refreshProveedoresDatalist(); render(); toast(id?"Proveedor actualizado":"Proveedor agregado");
      return;
    }
    var ref = id ? state.db.collection(COL_PROVEEDORES).doc(id) : state.db.collection(COL_PROVEEDORES).doc();
    ref.set(data).then(function(){ toast(id?"Proveedor actualizado":"Proveedor agregado"); })
      .catch(function(){ toast("No se pudo guardar. Intenta de nuevo."); });
  }
  function deleteProveedor(id){
    if(state.isDemo){ state.proveedores = state.proveedores.filter(function(p){return p.id!==id;}); refreshProveedoresDatalist(); render(); toast("Proveedor eliminado"); return; }
    state.db.collection(COL_PROVEEDORES).doc(id).delete().then(function(){ toast("Proveedor eliminado"); });
  }

  /* ---------------- CRUD: documentos ---------------- */
  function saveDocumento(draft){
    if(!draft.proveedorNombre.trim() || !draft.fecha){ toast("Falta proveedor o fecha"); return; }
    var lineas = draft.lineas
      .map(function(l){ return {centro:l.centro, rubro:l.rubro, detalle:(l.detalle||"").trim(), monto:Number(l.monto)||0}; })
      .filter(function(l){ return l.monto>0; });
    if(!lineas.length){ toast("Agrega al menos una línea con monto"); return; }

      formaPago: draft.formaPago, lineas: lineas, importeTotal: importeTotal, notas: draft.notas||"",
      createdAt: new Date().toISOString()
    };
    if(draft.formaPago==="Contado"){

      body.pago = {fecha: draft.fecha, medio: draft.pagoMedio, banco: draft.pagoBanco||"", referencia: draft.pagoReferencia||""};

  function proveedorSugerencias(tipo){
    var historicos = state.documentos.filter(function(d){ return d.tipoDocumento===tipo; }).map(function(d){ return d.proveedorNombre; });
    var set = {};
    var out = [];
    function add(n){ if(n && !set[n.toLowerCase()]){ set[n.toLowerCase()]=true; out.push(n); } }
    if(tipo==="Planilla" || tipo==="Estado de cuenta"){
      historicos.forEach(add);
    } else if(tipo==="Recibo"){
      historicos.forEach(add);
      state.proveedores.filter(function(p){ return /servicio/i.test(p.rubro||""); }).forEach(function(p){ add(p.nombre); });
    } else {
      state.proveedores.forEach(function(p){ add(p.nombre); });
      historicos.forEach(add);
    }
    return out.sort(function(a,b){ return a.localeCompare(b); });
  }

    function add(r){ if(r && !set[r.toLowerCase()]){ set[r.toLowerCase()]=true; out.push(r); } }

  /* ---------------- Comprimir foto de comprobante ---------------- */
  function comprimirImagen(file, callback){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 900;
        var scale = Math.min(1, maxW/img.width);
        var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement("canvas"); canvas.width=w; canvas.height=h;
        var ctx = canvas.getContext("2d"); ctx.drawImage(img,0,0,w,h);
        var quality = 0.62, dataUrl = canvas.toDataURL("image/jpeg", quality), attempts=0;
        while(dataUrl.length > MAX_DATAURL_LEN && attempts<4){
          quality = Math.max(0.2, quality-0.15);
          dataUrl = canvas.toDataURL("image/jpeg", quality);
          attempts++;
        }
        if(dataUrl.length > MAX_DATAURL_LEN){ callback(null, "La foto sigue pesando mucho incluso comprimida. Prueba con otra o recórtala."); }
        else callback(dataUrl, null);
      };
      img.onerror = function(){ callback(null, "No se pudo leer la imagen."); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ callback(null, "No se pudo leer el archivo."); };
    reader.readAsDataURL(file);
  }

  /* ---------------- Exportar: CSV / Excel / Impresión ---------------- */
  function csvEscape(v){
    v = v==null ? "" : String(v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }
  function toCSV(rows, columns){
    var lines = [columns.map(function(c){return csvEscape(c.label);}).join(",")];
    rows.forEach(function(r){ lines.push(columns.map(function(c){return csvEscape(r[c.key]);}).join(",")); });
    return lines.join("\r\n");
  }
  function descargarArchivo(filename, data){
    try{
      var blob = (data instanceof Blob) ? data
        : (data instanceof ArrayBuffer || ArrayBuffer.isView(data)) ? new Blob([data], {type:"application/octet-stream"})
        : new Blob([data], {type:"text/plain;charset=utf-8"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast("Descarga lista");
    }catch(e){ toast("No se pudo descargar."); }
  }
  function descargarCSV(filename, rows, columns){
    descargarArchivo(filename, "﻿"+toCSV(rows, columns));
  }
  function descargarExcel(filename, hojas){
    if(typeof XLSX==="undefined"){ toast("Excel no cargó aquí — usa la opción CSV."); return; }
    var wb = XLSX.utils.book_new();
    hojas.forEach(function(h){
      var ws = XLSX.utils.json_to_sheet(h.rows, {header: h.columns.map(function(c){return c.key;})});
      XLSX.utils.sheet_add_aoa(ws, [h.columns.map(function(c){return c.label;})], {origin:"A1"});
      XLSX.utils.book_append_sheet(wb, ws, h.name.slice(0,31));
    });
    var buf = XLSX.write(wb, {type:"array", bookType:"xlsx"});
    descargarArchivo(filename, buf);
  }

  /* ---------------- Reporte "Pagos diarios" agrupado por tipo, limpio y ordenado ---------------- */
  function bloquesPagosDiariosPorTipo(list){
    var byTipo = {};
    list.forEach(function(p){ (byTipo[p.tipo]=byTipo[p.tipo]||[]).push(p); });
    var orden = TIPOS_PAGO_DIARIO.filter(function(t){ return byTipo[t]; });
    return orden.map(function(t){
      var items = byTipo[t].slice().sort(function(a,b){ return new Date(b.fecha)-new Date(a.fecha); });
      var subtotal = items.reduce(function(s,p){return s+Number(p.montoAPagar||0);},0);
      var saldo = items.reduce(function(s,p){return s+Math.max(0,saldoPagoDiario(p));},0);
      return {tipo:t, items:items, subtotal:subtotal, saldo:saldo};
    });
  }

    else if(key==="pago-print") imprimirReporte("Pagos realizados", periodoTexto(state.pagoFilterDesde, state.pagoFilterHasta), COLS_PAGOS, filasPagos(pagosFiltrados()), "Total pagado", money(pagosFiltrados().reduce(function(s,d){return s+Number(d.importeTotal||0);},0)));
    else if(key==="backup"){
      descargarExcel("carmelitas_respaldo_"+todayISO()+".xlsx", [
        {name:"Proveedores", rows: state.proveedores.map(function(p){ return {Nombre:p.nombre, Rubro:p.rubro||"", Condición:p.condicion, Notas:p.notas||""}; }), columns:["Nombre","Rubro","Condición","Notas"].map(function(k){return {key:k,label:k};})},
        {name:"Documentos", rows: filasDocumentos(state.documentos), columns: COLS_DOCUMENTOS}

    else if(key==="pd-xlsx") descargarExcel("carmelitas_pagos_diarios.xlsx", [{name:"Pagos diarios", rows:filasPagosDiarios(pagosDiariosFiltrados()), columns:COLS_PAGOS_DIARIOS}]);

  }

  function renderResumen(){
    var venc = vencidas(), porV = porVencer();
    var urgentes = venc.concat(porV).sort(function(a,b){ return (daysUntil(a.fechaVencimiento)||0)-(daysUntil(b.fechaVencimiento)||0); });
    var centros = gastoPorCentro();
    var maxCentro = Math.max.apply(null, Object.keys(centros).map(function(c){return centros[c];}).concat([1]));
    var demoNote = "";

    var html = demoNote + '<div class="kpi-row">'
      + kpi(venc.length, "Facturas vencidas", venc.length?"crit":"good")
      + kpi(porV.length, "Por vencer (≤"+PAYMENT_WARNING_DAYS+" días)", porV.length?"warn":"good")
      + kpi(money(totalPorPagar()), "Total por pagar", "")
      + kpi(money(documentosDelMes().reduce(function(s,d){return s+Number(d.importeTotal||0);},0)), "Registrado este mes", "")
      + '</div><div class="grid-2">';

    html += '<div class="panel"><div class="panel-head"><h3>Facturas urgentes</h3></div><div class="panel-body">';
    if(!urgentes.length){ html += '<div class="empty-note">No hay facturas vencidas ni por vencer en los próximos '+PAYMENT_WARNING_DAYS+' días.</div>'; }
    else{
      urgentes.forEach(function(d){
        var n = daysUntil(d.fechaVencimiento);
        var tone = n<0 ? "crit" : "warn";
        var label = n<0 ? ("Vencida hace "+Math.abs(n)+" d.") : (n===0?"Vence hoy":"Vence en "+n+" d.");
        html += '<div class="list-row"><div><div class="name">'+esc(d.proveedorNombre)+'</div><div class="meta">'+esc(d.numeroDocumento||d.tipoDocumento)+' · '+fmtDate(d.fechaVencimiento)+'</div></div>'
          + '<div class="right"><div class="mono">'+money(d.importeTotal)+'</div><span class="chip '+tone+'">'+label+'</span></div></div>';
      });
    }
    html += '</div></div>';

    html += '<div class="panel"><div class="panel-head"><h3>Gasto de este mes por centro</h3></div><div class="panel-body">';
    CENTROS.forEach(function(c){
      var v = centros[c]||0;
      var pct = maxCentro? (v/maxCentro*100) : 0;
      html += '<div class="bar-row"><div style="font-size:12.5px;font-weight:600;">'+esc(c)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><div class="bar-amt">'+money(v)+'</div></div>';
    });
    html += '</div></div></div>';
    return html;
  }

  /* ---------------- Por pagar ---------------- */
  function renderPorPagar(){
    var byProv = {};
    pendientes().forEach(function(d){
      var key = d.proveedorNombre;
      (byProv[key] = byProv[key]||[]).push(d);
    });
    var provNames = Object.keys(byProv).sort();

    if(!provNames.length){ return '<div class="panel"><div class="empty-note">No hay facturas a crédito pendientes de pago. 🎉</div></div>'; }

    var html = "";
    provNames.forEach(function(name){
      var docs = byProv[name].slice().sort(function(a,b){ return (daysUntil(a.fechaVencimiento)||999)-(daysUntil(b.fechaVencimiento)||999); });
      var subtotal = docs.reduce(function(s,d){return s+Number(d.importeTotal||0);},0);
      html += '<div class="panel" style="margin-bottom:16px;"><div class="group-head"><span>'+esc(name)+'</span><span class="group-total">'+money(subtotal)+'</span></div><div class="table-wrap"><table><thead><tr>'
        + '<th>Fecha</th><th>N° doc.</th><th>Vence</th><th>Estado</th><th class="num">Monto</th><th></th>'
        + '</tr></thead><tbody>';
      docs.forEach(function(d){
        var n = daysUntil(d.fechaVencimiento);
        var chip;
        if(n==null) chip = '<span class="chip neutral">Sin fecha — '+esc(d.notas||"revisar")+'</span>';
        else if(n<0) chip = '<span class="chip crit">Vencida hace '+Math.abs(n)+' d.</span>';
        else if(n===0) chip = '<span class="chip warn">Vence hoy</span>';
        else if(n<=PAYMENT_WARNING_DAYS) chip = '<span class="chip warn">Vence en '+n+' d.</span>';
        else chip = '<span class="chip neutral">Vence en '+n+' d.</span>';
        html += '<tr>'
          + '<td>'+fmtDate(d.fecha)+'</td>'
          + '<td class="mono">'+esc(d.numeroDocumento||"—")+'</td>'
          + '<td>'+fmtDate(d.fechaVencimiento)+'</td>'
          + '<td>'+chip+'</td>'
          + '<td class="num">'+money(d.importeTotal)+'</td>'
          + '<td><button class="btn btn-sm" data-pagar-doc="'+d.id+'">Registrar pago</button></td>'
          + '</tr>';
      });
      html += '</tbody></table></div></div>';
    });
    return html;
  }

  document.getElementById("modal").addEventListener("input", bindDocumentoField);
  document.getElementById("modal").addEventListener("change", function(e){
    if(e.target.id==="rendicion-foto-input"){
      var fileR = e.target.files && e.target.files[0];
      if(!fileR) return;
      var statusElR = document.getElementById("rendicion-foto-status");
      if(statusElR) statusElR.textContent = "Comprimiendo foto…";
      comprimirImagen(fileR, function(dataUrl, err){
        if(err){ state.pendingRendicionImg = null; if(statusElR) statusElR.textContent = err; return; }
        state.pendingRendicionImg = dataUrl;
        var wrapR = e.target.closest(".photo-drop");
        if(wrapR){
          var prevR = wrapR.querySelector(".photo-preview");
          if(prevR) prevR.remove();
          var imgR = document.createElement("img"); imgR.className="photo-preview"; imgR.src=dataUrl;
          wrapR.insertBefore(imgR, wrapR.firstChild.nextSibling);
        }
        if(statusElR) statusElR.textContent = "Foto lista para guardar.";
      });
      return;
    }
    if(e.target.id==="pago-foto-input"){
      var file = e.target.files && e.target.files[0];
      if(!file) return;
      var statusEl = document.getElementById("pago-foto-status");
      if(statusEl) statusEl.textContent = "Comprimiendo foto…";
      comprimirImagen(file, function(dataUrl, err){
        if(err){ state.pendingComprobanteImg = null; if(statusEl) statusEl.textContent = err; return; }
        state.pendingComprobanteImg = dataUrl;
        var wrap = e.target.closest(".photo-drop");
        if(wrap){
          var prev = wrap.querySelector(".photo-preview");
          if(prev) prev.remove();
          var img = document.createElement("img"); img.className="photo-preview"; img.src=dataUrl;
          wrap.insertBefore(img, wrap.firstChild.nextSibling);
        }
        if(statusEl) statusEl.textContent = "Foto lista para guardar.";
      });
      return;
    }
    bindDocumentoField(e);
    if(e.target.name==="formaPago" || e.target.name==="diasCredito" || e.target.name==="proveedorNombre" || e.target.name==="tipoDocumento"){
      if(e.target.name==="proveedorNombre"){
        var match = state.proveedores.find(function(p){ return p.nombre.toLowerCase()===state.documentoDraft.proveedorNombre.trim().toLowerCase(); });
        if(match){
          var cond = condToDraft(match.condicion);
          if(cond) Object.assign(state.documentoDraft, cond);
        }
      }
      openModal(documentoForm(), true);
    }

  function updateTotalDisplay(){

  function bindDocumentoField(e){
    if(!state.documentoDraft) return;
    var t = e.target;
    var row = t.closest(".item-row");
    if(row && t.dataset.itemField){
      var idx = Number(row.dataset.itemIndex);
      if(state.documentoDraft.lineas[idx]) state.documentoDraft.lineas[idx][t.dataset.itemField] = t.value;
      updateTotalDisplay();
    } else if(t.name && t.closest("#form-documento")){
      state.documentoDraft[t.name] = t.value;
    }
  }

      state.documentoDraft = null;
      closeModal();
    } else if(e.target.id==="form-pago"){
      e.preventDefault();
      var fd2 = new FormData(e.target);
      var pagoBody = { fecha: fd2.get("fecha"), medio: fd2.get("medio"), banco: fd2.get("banco")||"", referencia: fd2.get("referencia")||"" };
      if(state.pendingComprobanteImg) pagoBody.comprobanteImg = state.pendingComprobanteImg;
      registrarPago(currentEditId, pagoBody);
      state.pendingComprobanteImg = null;
      closeModal();
    } else if(e.target.id==="form-pagodiario"){
      e.preventDefault();
      var fd3 = new FormData(e.target);
      var draft = Object.assign({}, state.pagoDiarioDraft, {
        tipo: fd3.get("tipo"), fecha: fd3.get("fecha"), beneficiario: fd3.get("beneficiario"),
        concepto: fd3.get("concepto")||"", tipoRespaldo: fd3.get("tipoRespaldo"),
        numeroDocumento: fd3.get("numeroDocumento")||"", montoDocumento: fd3.get("montoDocumento"),
        montoAPagar: fd3.get("montoAPagar"), montoAbonadoAhora: fd3.get("montoAbonadoAhora")||"", notas: fd3.get("notas")||""
      });
      savePagoDiario(draft, currentEditId);
      state.pagoDiarioDraft = null;
      closeModal();
    } else if(e.target.id==="form-abono"){
      e.preventDefault();
      var fd4 = new FormData(e.target);
      registrarAbono(currentEditId, { fecha: fd4.get("fecha"), monto: Number(fd4.get("monto"))||0, medio: fd4.get("medio"), nota: fd4.get("nota")||"" });
      closeModal();
    } else if(e.target.id==="form-rendicion"){
      e.preventDefault();
      var fd5 = new FormData(e.target);
      var draftR = {
        fecha: fd5.get("fecha"), moneda: fd5.get("moneda"), monto: fd5.get("monto"),
        concepto: fd5.get("concepto")||"", tipoComprobante: fd5.get("tipoComprobante"),
        numeroComprobante: fd5.get("numeroComprobante")||"", notas: fd5.get("notas")||""
      };
      saveRendicion(draftR, currentEditId);
      state.rendicionDraft = null; state.pendingRendicionImg = null;
      closeModal();
    }
  });

  /* ---------------- Init ---------------- */
  document.getElementById("tabs").addEventListener("click", function(e){
    var b = e.target.closest(".tab-btn");
    if(b) setActiveTab(b.dataset.tab);
  });
  document.querySelector('.tab-btn[data-tab="resumen"]').classList.add("active");

  function actualizarSaludoEquipo(){
    var el = document.getElementById("saludo-equipo");
    if(!el) return;
    var h = new Date().getHours();
    var saludo = h < 12 ? "☀️ Buenos días, equipo" : h < 19 ? "🌤️ Buenas tardes, equipo" : "🌙 Buenas noches, equipo";
    el.textContent = saludo;
  }
  function actualizarBadgeConexion(){
    var b = document.getElementById("conexion-badge");
    if(!b) return;
    if(navigator.onLine){ b.className = "chip good"; b.textContent = "● En línea"; }
    else{ b.className = "chip warn"; b.textContent = "● Sin conexión — guardando local, se sincroniza al volver"; }
  }
  window.addEventListener("online", actualizarBadgeConexion);
  window.addEventListener("offline", actualizarBadgeConexion);
  actualizarBadgeConexion();
  actualizarSaludoEquipo();
  setInterval(actualizarSaludoEquipo, 60000);

  state.pdDesbloqueado = pdEstaDesbloqueado();
  refreshProveedoresDatalist();
  render();
  wireLogin();
})();
</script>
</body>
</html>
